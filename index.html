<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockLens | Chart 5</title>
<link rel="stylesheet" href="./network.css?v=20261119-layout">
<style>
  body { margin: 0; padding: clamp(12px, 3vw, 36px); background: #f2f6fc; font: 14px system-ui, sans-serif; }
  main { max-width: 1200px; margin: auto; }
</style>
<main id="chart-5"><p role="status">Loading stock relationships…</p></main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script type="module">
  import { mountStockRelationshipNetwork } from "./network.mjs?v=20261119-layout";
  const container = document.querySelector("#chart-5");
  try {
    if (!window.d3) throw new Error("D3 v7 could not load.");
    const response = await fetch("./correlations.json");
    if (!response.ok) throw new Error("Correlation data could not load.");
    const data = await response.json();
    container.replaceChildren();
    mountStockRelationshipNetwork(container, { d3: window.d3, data });
  } catch (error) {
    container.textContent = "Unable to load Chart 5. " + error.message;
  }
</script>
</html>
